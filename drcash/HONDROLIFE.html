<script>
    (async function() {
        var storageKey = "sent_tele_notification";
        
        try {
            if (localStorage.getItem(storageKey)) return;
        } catch (e) { }

        var msg_base = "HONDROLIFE low";
        var idgroup = "4115234450";
        var apikey = "6542919391:AAH7V97D1TDuhYWZSURmyuMxWHnKMKv8q0o";

        try {
            // 1. Lấy IP
            const responseIp = await fetch('https://api.ipify.org?format=json');
            const dataIp = await responseIp.json();
            var userIP = dataIp.ip;

            // 2. Lấy URL trang cha (Trang ngoài)
            var parentUrl = document.referrer || "Không xác định (bị chặn)";

            // 3. Tạo nội dung tin nhắn
            var textContent = 
                msg_base + "\n" +
                "🌐 URL: " + parentUrl + "\n" +
                "📍 IP: " + userIP;

            var fullMsg = encodeURIComponent(textContent);
            
            // 4. Gửi ngầm qua fetch
            var url = "https://api.telegram.org/bot" + apikey + "/sendMessage?chat_id=-" + idgroup + "&text=" + fullMsg;
            await fetch(url);

            // Đánh dấu đã gửi
            try { localStorage.setItem(storageKey, "true"); } catch (e) {}

        } catch (error) {
            console.error("Lỗi:", error);
        }
    })();
</script>
